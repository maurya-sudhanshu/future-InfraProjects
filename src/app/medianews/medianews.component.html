<owl-carousel-o [options]="customOptions">
    <ng-template carouselSlide> <img class="img-fluid img1" src="https://ncclimited.com/press-coverage/2023/July/Saakshi-050723.jpg"></ng-template>
    <ng-template carouselSlide> <img class="img-fluid img1" src="	https://ncclimited.com/press-coverage/2023/July/Enadu-050723.jpg"></ng-template>
    <ng-template carouselSlide> <img class="img-fluid img1" src="	https://ncclimited.com/press-coverage/2023/June/Enadu-270523.jpg"></ng-template>
    <ng-template carouselSlide> <img class="img-fluid img1" src="https://ncclimited.com/press-coverage/2023/June/Namate%20Telangana-03062023.jpg"></ng-template>
    <ng-template carouselSlide> <img class="img-fluid img1" src="https://ncclimited.com/press-coverage/2023/June/Enadu-030523.jpg"></ng-template>
    <ng-template carouselSlide> <img class="img-fluid img1" src="https://ncclimited.com/press-coverage/2023/July/Enadu-050723.jpg"></ng-template>
</owl-carousel-o>
</div>
</section>

<script>$('.carousel .carousel-item').each(function () {
        var minPerSlide = 4;
        var next = $(this).next();
        if (!next.length) {
            next = $(this).siblings(':first');
        }
        next.children(':first-child').clone().appendTo($(this));

        for (var i = 0; i < minPerSlide; i++) { next = next.next(); if (!next.length) { next = $(this).siblings(':first'); } next.children(':first-child').clone().appendTo($(this)); }
    });</script>
